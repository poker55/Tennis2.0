apiVersion: apps/v1
kind: Deployment
metadata:
  name: tennis-score
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tennis-score
  template:
    metadata:
      labels:
        app: tennis-score
    spec:
      containers:
        - name: tennis-score
          image: tennis-score-phase1:redis
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tennis-score
spec:
  type: NodePort
  selector:
    app: tennis-score
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
